syntax = "proto3";

// package 是 proto 内部的命名空间，避免不同文件符号冲突；
// 它和 Go 包名无关，真正的 Go 包名看 go_package。
package hello;

// go_package 决定生成代码的 import 路径和包名：
// import 路径 = LearnGo/api/demo，包名 = demo。
option go_package = "LearnGo/api/demo;demo";

// message 是数据结构，字段后的 = 1、= 2 是字段编号（协议里的稳定标识）。
message HelloRequest {
  string name = 1;           // string
  int32 age = 2;             // int32
  bool is_vip = 3;           // bool，snake_case 会生成 Go 的 IsVip
  repeated string tags = 4;  // repeated -> Go []string
  Level level = 5;           // 枚举字段
  Address address = 6;       // 另一个 message 作为字段类型 -> Go *Address
  int32 count = 7;           // 控制 server-streaming 返回条数
  int32 sleep_ms = 8;        // 演示超时：服务端人为延迟（毫秒）
}

// proto3 枚举第一个值必须是 0。
enum Level {
  LEVEL_UNSPECIFIED = 0;
  LEVEL_BASIC = 1;
  LEVEL_PREMIUM = 2;
}

message Address {
  string city = 1;
  string street = 2;
}

message HelloReply {
  string message = 1;
}

// service 定义 RPC；SayHello 是 Unary RPC（一问一答）。
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  // SayHelloStream 是 Server-streaming：一个请求，服务端流式返回多条响应。
  rpc SayHelloStream (HelloRequest) returns (stream HelloReply);
  // SayHelloClientStream 是 Client-streaming：客户端流式发多个请求，服务端回一个响应。
  rpc SayHelloClientStream (stream HelloRequest) returns (HelloReply);
  // SayHelloBidi 是 Bidirectional-streaming：客户端和服务端同时流式收发。
  rpc SayHelloBidi (stream HelloRequest) returns (stream HelloReply);
}
